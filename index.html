{ l.n }}<\u002Fspan><span style=\"white-space:pre-wrap;overflow-wrap:anywhere;padding-right:16px;color:{{ l.color }}\"><sc-for list=\"{{ l.segs }}\" as=\"g\"><span style=\"color:{{ g.fg }};background:{{ g.bg }};border-radius:2px\">{{ g.t }}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;padding:12px 16px;background:var(--code-bar);font:400 0.8125rem/1.25rem var(--font-mono);color:var(--code-muted)\">{{ d.p.metaLine }} · brackets mark values to replace<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <sc-if value=\"{{ d.hasPh }}\">\n          <section id=\"sec-customize\" tabindex=\"-1\" aria-labelledby=\"h-customize\" class=\"placeholder-form\" style=\"margin-top:32px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:24px\">\n              <div style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:4px\">\n                <h2 id=\"h-customize\" style=\"margin:0;font:600 1.25rem/1.75rem var(--font-sans)\">Fill in the placeholders<\u002Fh2>\n                <p style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Your values replace the brackets in the prompt above as you type. Nothing leaves your browser.<\u002Fp>\n              <\u002Fdiv>\n              <button type=\"button\" aria-expanded=\"{{ d.customExpanded }}\" aria-controls=\"customize-form\" sc-camel-on-click=\"{{ d.toggleCustom }}\" style=\"min-height:48px;padding:0 20px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">{{ d.customToggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ d.customOpen }}\">\n              <form id=\"customize-form\" sc-camel-on-submit=\"{{ d.copyCustom }}\" sc-camel-no-validate=\"{{ true }}\" style=\"display:flex;flex-direction:column;gap:24px;padding:24px;border-top:var(--bw) solid var(--color-border)\">\n                <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:10px;background:var(--color-sunken)\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px\">\n                    <div style=\"flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px\"><span aria-hidden=\"true\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;background:var(--color-primary-soft);color:var(--color-primary)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\"><path d=\"M4 5h16v11h-9l-5 4v-4H4z\"><\u002Fpath><path d=\"M8 9.5h8\"><\u002Fpath><path d=\"M8 12.5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"display:flex;flex-direction:column;min-width:0\"><strong style=\"font:600 0.9375rem/1.375rem var(--font-sans)\">Let an AI fill these in<\u002Fstrong><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Download the questions, have any AI answer them, then import the file.<\u002Fspan><\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><button type=\"button\" sc-camel-on-click=\"{{ d.qDownload }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-bg)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M12 4v11\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M5 20h14\"><\u002Fpath><\u002Fsvg>Download questions<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ d.qCopy }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-bg)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M9 9h11v11H9z\"><\u002Fpath><path d=\"M5 15H4V4h11v1\"><\u002Fpath><\u002Fsvg>{{ d.qCopyLabel }}<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ d.qPick }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M12 16V5\"><\u002Fpath><path d=\"M7 10l5-5 5 5\"><\u002Fpath><path d=\"M5 20h14\"><\u002Fpath><\u002Fsvg>Import answers<\u002Fbutton><input id=\"ph-import-file\" type=\"file\" accept=\".md,.markdown,.txt,text/plain,text/markdown\" sc-camel-on-change=\"{{ d.qFile }}\" tabindex=\"-1\" aria-hidden=\"true\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <details>\n                    <summary style=\"display:inline-flex;align-items:center;min-height:44px;cursor:pointer;font:600 0.875rem/1.25rem var(--font-sans);color:var(--color-primary)\">Or paste answers as text<\u002Fsummary>\n                    <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n                      <label for=\"ph-import-text\" style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Paste the AI's reply, or lines like \"Product name: Clinic booking app\".<\u002Flabel>\n                      <textarea id=\"ph-import-text\" rows=\"4\" value=\"{{ d.qPaste }}\" sc-camel-on-change=\"{{ d.onQPaste }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 0.875rem/1.375rem var(--font-mono);resize:vertical\"><\u002Ftextarea>\n                      <div style=\"display:flex\"><button type=\"button\" sc-camel-on-click=\"{{ d.qPasteFill }}\" style=\"white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-bg)\">Fill fields from text<\u002Fbutton><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdetails>\n                  <div aria-live=\"polite\" style=\"display:contents\"><sc-if value=\"{{ d.qHasMsg }}\"><p style=\"margin:0;padding:10px 12px;border-radius:8px;border:var(--bw) solid {{ d.qMsgFg }};background:var(--color-surface);font:500 0.875rem/1.375rem var(--font-sans);color:var(--color-text)\">{{ d.qMsg }}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n                <\u002Fdiv>\n                <p aria-live=\"polite\" style=\"margin:0;font:500 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ d.filledText }}<\u002Fp>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px;align-items:start\">\n                  <sc-for list=\"{{ d.fields }}\" as=\"f\">\n                    <div class=\"form-field\" style=\"display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:6px;align-content:start;min-width:0\">\n                      <label for=\"{{ f.id }}\" style=\"align-self:end;min-width:0;font:600 0.9375rem/1.25rem var(--font-sans);overflow-wrap:anywhere\">{{ f.label }}<\u002Flabel>\n                      <textarea id=\"{{ f.id }}\" rows=\"2\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.hint }}\" autocomplete=\"off\" aria-describedby=\"customize-error\" style=\"width:100%;min-height:48px;padding:10px 12px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-bg);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans);resize:vertical\" style-focus=\"border-color:var(--color-primary)\"><\u002Ftextarea>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div id=\"customize-error\" aria-live=\"assertive\">\n                  <sc-if value=\"{{ d.hasCustomErr }}\"><p style=\"display:flex;gap:8px;align-items:flex-start;margin:0;color:var(--color-error);font:500 0.9375rem/1.5rem var(--font-sans)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;margin-top:2px\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18v.01\"><\u002Fpath><\u002Fsvg><span>Error: {{ d.customErr }}<\u002Fspan><\u002Fp><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n                  <button type=\"submit\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\">Copy customized prompt<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ d.clearFills }}\" style=\"min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Clear all fields<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fform>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ d.hasUse }}\">\n          <section id=\"sec-when\" tabindex=\"-1\" aria-labelledby=\"h-when\" style=\"margin-top:48px;display:flex;flex-direction:column;gap:16px\">\n            <h2 id=\"h-when\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">When to use it<\u002Fh2>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;max-width:68ch\"><sc-for list=\"{{ d.useCases }}\" as=\"u\"><li>{{ u }}<\u002Fli><\u002Fsc-for><\u002Ful>\n          <\u002Fsection>\n        <\u002Fsc-if>\n        <section id=\"sec-about\" tabindex=\"-1\" aria-labelledby=\"h-about\" style=\"margin-top:48px;display:flex;flex-direction:column;gap:16px\">\n          <h2 id=\"h-about\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">What it does<\u002Fh2>\n          <p style=\"margin:0;max-width:68ch;text-wrap:pretty\">{{ d.p.description }}<\u002Fp>\n        <\u002Fsection>\n        <sc-if value=\"{{ d.hasExample }}\">\n          <section id=\"sec-example\" tabindex=\"-1\" aria-labelledby=\"h-example\" style=\"margin-top:48px;display:flex;flex-direction:column;gap:16px\">\n            <h2 id=\"h-example\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Example input<\u002Fh2>\n            <pre style=\"margin:0;padding:16px 24px;border-radius:8px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);font:400 0.875rem/1.5rem var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere\">{{ d.p.exampleInput }}<\u002Fpre>\n          <\u002Fsection>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ d.hasResults }}\">\n          <section id=\"sec-results\" tabindex=\"-1\" aria-labelledby=\"h-results\" style=\"margin-top:48px;display:flex;flex-direction:column;gap:16px\">\n            <h2 id=\"h-results\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">What you get back<\u002Fh2>\n            <ol style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;max-width:68ch\"><sc-for list=\"{{ d.p.sampleResults }}\" as=\"x\"><li>{{ x }}<\u002Fli><\u002Fsc-for><\u002Fol>\n          <\u002Fsection>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ d.hasNotes }}\">\n          <section id=\"sec-notes\" tabindex=\"-1\" aria-labelledby=\"h-notes\" style=\"margin-top:48px;display:flex;flex-direction:column;gap:16px\">\n            <h2 id=\"h-notes\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Notes<\u002Fh2>\n            <ul style=\"margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px;max-width:68ch\"><sc-for list=\"{{ d.p.notes }}\" as=\"x\"><li>{{ x }}<\u002Fli><\u002Fsc-for><\u002Ful>\n          <\u002Fsection>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ d.extras }}\" as=\"x\">\n          <section id=\"{{ x.id }}\" tabindex=\"-1\" style=\"margin-top:48px;display:flex;flex-direction:column;gap:8px;max-width:68ch\">\n            <h2 style=\"margin:0 0 8px;font:600 1.5rem/2rem var(--font-sans)\">{{ x.heading }}<\u002Fh2>\n            <sc-for list=\"{{ x.items }}\" as=\"it\">\n              <sc-if value=\"{{ it.isH }}\"><h3 style=\"margin:16px 0 0;font:600 1.125rem/1.75rem var(--font-sans)\">{{ it.t }}<\u002Fh3><\u002Fsc-if>\n              <sc-if value=\"{{ it.isLi }}\"><p style=\"margin:0;display:flex;gap:12px\"><span aria-hidden=\"true\" style=\"color:var(--color-accent);font-family:var(--font-mono)\">-<\u002Fspan><span>{{ it.t }}<\u002Fspan><\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{ it.isCheck }}\"><p style=\"margin:0;display:flex;gap:12px;align-items:flex-start\"><span aria-hidden=\"true\" style=\"flex:none;width:16px;height:16px;margin-top:4px;border-radius:4px;border:2px solid var(--color-border-strong)\"><\u002Fspan><span>{{ it.t }}<\u002Fspan><\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{ it.isP }}\"><p style=\"margin:0\">{{ it.t }}<\u002Fp><\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fsc-for>\n        <nav aria-label=\"Previous and next step\" style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:64px;padding-top:24px;border-top:var(--bw) solid var(--color-border)\">\n          <a href=\"{{ d.prev.href }}\" style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:8px;border:var(--bw) solid var(--color-border);text-decoration:none;color:var(--color-text)\" style-hover=\"border-color:var(--color-border-strong)\"><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Previous step · {{ d.prev.stepLabel }}<\u002Fspan><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ d.prev.title }}<\u002Fspan><\u002Fa>\n          <a href=\"{{ d.next.href }}\" style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:8px;border:var(--bw) solid var(--color-border);text-decoration:none;color:var(--color-text);text-align:right\" style-hover=\"border-color:var(--color-border-strong)\"><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Next step · {{ d.next.stepLabel }}<\u002Fspan><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ d.next.title }}<\u002Fspan><\u002Fa>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-label=\"About this prompt\" style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n        <nav aria-labelledby=\"h-toc\" style=\"padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n          <h2 id=\"h-toc\" style=\"margin:0 0 8px;padding:0 8px;font:600 1rem/1.5rem var(--font-sans)\">On this page<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\">\n            <sc-for list=\"{{ d.toc }}\" as=\"t\"><li><button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex;align-items:center;width:100%;min-height:44px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--color-primary);font:500 0.9375rem/1.25rem var(--font-sans);text-align:left;cursor:pointer\" style-hover=\"background:var(--color-sunken)\">{{ t.label }}<\u002Fbutton><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fnav>\n        <section aria-labelledby=\"h-file\" style=\"padding:24px;border-radius:12px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:16px\">\n          <h2 id=\"h-file\" style=\"margin:0;font:600 1rem/1.5rem var(--font-sans)\">File details<\u002Fh2>\n          <dl style=\"margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font:400 0.875rem/1.25rem var(--font-sans)\">\n            <dt style=\"color:var(--color-text-muted)\">Path<\u002Fdt><dd style=\"margin:0;font-family:var(--font-mono);overflow-wrap:anywhere\">{{ d.p.path }}<\u002Fdd>\n            <dt style=\"color:var(--color-text-muted)\">Agent<\u002Fdt><dd style=\"margin:0;overflow-wrap:anywhere\">{{ d.p.agent }}<\u002Fdd>\n            <dt style=\"color:var(--color-text-muted)\">Model<\u002Fdt><dd style=\"margin:0;font-family:var(--font-mono)\">{{ d.p.model }}<\u002Fdd>\n            <dt style=\"color:var(--color-text-muted)\">Size<\u002Fdt><dd style=\"margin:0\">{{ d.p.metaLine }}<\u002Fdd>\n            <dt style=\"color:var(--color-text-muted)\">Tags<\u002Fdt><dd style=\"margin:0;font-family:var(--font-mono);overflow-wrap:anywhere\">{{ d.p.tagsText }}<\u002Fdd>\n          <\u002Fdl>\n        <\u002Fsection>\n        <section aria-labelledby=\"h-st\" style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px;align-items:flex-start\">\n          <h2 id=\"h-st\" style=\"margin:0;font:600 1rem/1.5rem var(--font-sans)\">Status<\u002Fh2>\n          <span class=\"status-badge\" style=\"display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:2px 8px;border-radius:4px;background:{{ d.p.st.bg }};color:{{ d.p.st.fg }};font:600 0.8125rem/1.25rem var(--font-sans)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><sc-for list=\"{{ d.p.st.icon }}\" as=\"sp\"><path d=\"{{ sp }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>{{ d.p.st.label }}<\u002Fspan>\n          <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ d.statusNote }}<\u002Fp>\n        <\u002Fsection>\n        <section aria-labelledby=\"h-related\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <h2 id=\"h-related\" style=\"margin:0;font:600 1rem/1.5rem var(--font-sans)\">Related prompts<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\">\n            <sc-for list=\"{{ d.related }}\" as=\"p\"><li style=\"border-top:var(--bw) solid var(--color-border)\"><a href=\"{{ p.href }}\" style=\"display:flex;flex-direction:column;gap:4px;padding:12px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">{{ p.title }}<\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ p.folder }}/<\u002Fspan><\u002Fa><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsection>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ workflowPage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-workflow\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text)\">Workflow<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:760px;margin-bottom:48px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em;text-wrap:balance\">Compose your project workflow<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">Answer the brief once, fill in each step's placeholders here, and export one markdown file. It carries all 25 prompts in order with the anti-slop rules attached as binding rules, ready to paste into any AI tool.<\u002Fp>\n    <\u002Fheader>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:stretch\">\n      <div style=\"flex:3 1 600px;min-width:0;display:flex;flex-direction:column;gap:64px\">\n        <section id=\"wf-io\" aria-labelledby=\"h-io\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;max-width:64ch\">\n            <h2 id=\"h-io\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Let an AI draft your answers<\u002Fh2>\n            <p style=\"margin:0;color:var(--color-text-muted)\">Download every question as one file, ask any AI to suggest answers, then import the file back here. Each answer lands in its own field, and you can edit all of them afterwards.<\u002Fp>\n          <\u002Fdiv>\n          <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:var(--bw) solid var(--color-border)\">\n            <li style=\"display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:var(--bw) solid var(--color-border)\"><span aria-hidden=\"true\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--color-primary-soft);color:var(--color-primary)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\"><path d=\"M12 4v11\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M5 20h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px\"><div style=\"flex:1 1 300px;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:500 0.75rem/1rem var(--font-mono);color:var(--color-accent)\">Step 1<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Get the questions<\u002Fstrong><p style=\"margin:2px 0 0;font:400 0.9375rem/1.375rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">{{ wfQCountText }} in one outline, grouped by phase. Answers you already gave are included.<\u002Fp><\u002Fdiv><\u002Fdiv>\n                <div style=\"flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px\"><button type=\"button\" sc-camel-on-click=\"{{ wfQDownload }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 0.9375rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\">Download question file<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ wfQCopyAll }}\" style=\"white-space:nowrap;min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">{{ wfQCopyLabel }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n            <\u002Fli>\n            <li style=\"display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:var(--bw) solid var(--color-border)\"><span aria-hidden=\"true\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--color-primary-soft);color:var(--color-primary)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\"><path d=\"M4 5h16v11h-9l-5 4v-4H4z\"><\u002Fpath><path d=\"M8 9.5h8\"><\u002Fpath><path d=\"M8 12.5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:500 0.75rem/1rem var(--font-mono);color:var(--color-accent)\">Step 2<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Ask an AI to answer them<\u002Fstrong><p style=\"margin:2px 0 0;font:400 0.9375rem/1.375rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">Upload the file to Claude, ChatGPT or Gemini with this message. The AI answers every question; where it lacks details, it gives a concrete recommendation marked \"Suggested:\".<\u002Fp><\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;padding:8px;border-radius:10px;background:var(--color-sunken)\"><p style=\"flex:1 1 300px;min-width:0;margin:0;padding:6px 8px;font:400 0.8125rem/1.375rem var(--font-mono);color:var(--color-text);overflow-wrap:anywhere\">{{ wfAskText }}<\u002Fp><button type=\"button\" sc-camel-on-click=\"{{ wfAskCopy }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer;align-self:center\" style-hover=\"background:var(--color-bg)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M9 9h11v11H9z\"><\u002Fpath><path d=\"M5 15H4V4h11v1\"><\u002Fpath><\u002Fsvg>{{ wfAskLabel }}<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n            <\u002Fli>\n            <li sc-camel-on-drag-over=\"{{ imp.onDragOver }}\" sc-camel-on-drag-leave=\"{{ imp.onDragLeave }}\" sc-camel-on-drop=\"{{ imp.onDrop }}\" style=\"display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:var(--bw) solid var(--color-border)\"><span aria-hidden=\"true\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--color-primary-soft);color:var(--color-primary)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\"><g style=\"transform:translateY({{ imp.arrowY }});transition:transform 240ms var(--ease)\"><path d=\"M12 16V5\"><\u002Fpath><path d=\"M7 10l5-5 5 5\"><\u002Fpath><\u002Fg><path d=\"M5 20h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:12px;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:500 0.75rem/1rem var(--font-mono);color:var(--color-accent)\">Step 3<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Import the answers<\u002Fstrong><p style=\"margin:2px 0 0;font:400 0.9375rem/1.375rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">Every answer goes into its own field and is saved on this device. You can edit any of them afterwards.<\u002Fp><\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 12px 12px 16px;border-radius:10px;border:2px dashed {{ imp.dzBorder }};background:{{ imp.dzBg }};transition:border-color 160ms var(--ease),background 160ms var(--ease)\"><span style=\"flex:1 1 220px;min-width:0;font:500 0.9375rem/1.375rem var(--font-sans);color:var(--color-text-muted)\">Drop the answered .md or .txt file here<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ imp.pick }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M12 16V5\"><\u002Fpath><path d=\"M7 10l5-5 5 5\"><\u002Fpath><path d=\"M5 20h14\"><\u002Fpath><\u002Fsvg>Choose file<\u002Fbutton><input id=\"wf-import-file\" type=\"file\" accept=\".md,.markdown,.txt,text/plain,text/markdown\" sc-camel-on-change=\"{{ imp.onChange }}\" tabindex=\"-1\" aria-hidden=\"true\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fli>\n          <\u002Fol>\n          <details style=\"margin-top:-24px;border-bottom:var(--bw) solid var(--color-border)\">\n            <summary style=\"display:flex;align-items:center;min-height:48px;cursor:pointer;font:600 0.9375rem/1.5rem var(--font-sans);color:var(--color-primary)\">Or paste answers as text<\u002Fsummary>\n            <div style=\"display:flex;flex-direction:column;gap:10px;padding:4px 0 20px\">\n              <label for=\"wf-import-text\" style=\"font:400 0.9375rem/1.375rem var(--font-sans);color:var(--color-text-muted)\">Paste the AI's reply, a phase you copied and answered, or any notes written as \"Label: answer\" lines, such as \"Industry: healthcare\".<\u002Flabel>\n              <textarea id=\"wf-import-text\" rows=\"6\" value=\"{{ impPaste }}\" sc-camel-on-change=\"{{ onImpPaste }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 0.875rem/1.375rem var(--font-mono);resize:vertical\"><\u002Ftextarea>\n              <div style=\"display:flex\"><button type=\"button\" sc-camel-on-click=\"{{ impPasteFill }}\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Fill fields from text<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdetails>\n          <div aria-live=\"polite\" style=\"display:contents\"><sc-if value=\"{{ imp.hasMsg }}\"><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-radius:8px;border:var(--bw) solid {{ imp.msgFg }};background:{{ imp.msgBg }}\"><span style=\"flex:1 1 260px;min-width:0;font:500 0.9375rem/1.375rem var(--font-sans);color:var(--color-text)\">{{ imp.msg }}<\u002Fspan><sc-if value=\"{{ imp.canUndo }}\"><button type=\"button\" sc-camel-on-click=\"{{ imp.undo }}\" style=\"min-height:44px;padding:0;border:0;background:transparent;color:var(--color-text);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Undo import<\u002Fbutton><\u002Fsc-if><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n        <\u002Fsection>\n        <section id=\"wf-prep\" aria-labelledby=\"h-prep\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px\"><div style=\"display:flex;flex-direction:column;gap:4px;max-width:64ch;flex:1 1 320px\">\n            <h2 id=\"h-prep\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Before you start<\u002Fh2>\n            <p style=\"margin:0;color:var(--color-text-muted);max-width:64ch\">Three answers are required. Everything else is optional: anything you leave blank, the AI will ask you about.<\u002Fp>\n          <\u002Fdiv><button type=\"button\" sc-camel-on-click=\"{{ wfCopyPrepQ }}\" aria-label=\"Copy the questions in this section and the shared answers as an outline\" style=\"display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.875rem/1.25rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M9 9h11v11H9z\"><\u002Fpath><path d=\"M5 15H4V4h11v1\"><\u002Fpath><\u002Fsvg>{{ wfPrepQLabel }}<\u002Fbutton><\u002Fdiv>\n          <ol class=\"prep-list\" style=\"list-style:none;margin:0;padding:0;border-top:var(--bw) solid var(--color-border)\">\n            <li style=\"display:flex;gap:16px;padding:24px 0;border-bottom:var(--bw) solid var(--color-border)\"><span aria-hidden=\"true\" style=\"flex:none;width:28px;font:500 0.875rem/1.5rem var(--font-mono);color:var(--color-accent)\">01<\u002Fspan><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;flex-direction:column;gap:2px\"><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><label for=\"wf-name\" style=\"font:600 1rem/1.5rem var(--font-sans)\">Name your project<\u002Flabel><span style=\"font:500 0.75rem/1rem var(--font-sans);padding:2px 8px;border-radius:999px;background:var(--color-accent-soft);color:var(--color-accent)\">Required<\u002Fspan><\u002Fdiv><span style=\"font:400 0.9375rem/1.375rem var(--font-sans);color:var(--color-text-muted)\">It becomes the title of your file.<\u002Fspan><\u002Fdiv><textarea id=\"wf-name\" rows=\"2\" value=\"{{ fName.value }}\" sc-camel-on-change=\"{{ onWfName }}\" sc-camel-on-blur=\"{{ fName.onBlur }}\" aria-invalid=\"{{ fName.invalid }}\" aria-describedby=\"{{ fName.describedby }}\" aria-required=\"true\" placeholder=\"e.g. Clinic booking app\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:{{ fName.bwid }};border-color:{{ fName.bo -font-sans);color:var(--color-text-muted)\">1 is calm, 3 is bold.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px;margin-top:4px\"><sc-for list=\"{{ wfDials }}\" as=\"dl\"><div role=\"group\" aria-label=\"{{ dl.aria }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 16px\"><span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:600 0.9375rem/1.375rem var(--font-sans)\">{{ dl.n }}<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ dl.t }}<\u002Fspan><\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(3,44px);gap:6px\"><sc-for list=\"{{ dl.opts }}\" as=\"o\"><button type=\"button\" aria-pressed=\"{{ o.pressed }}\" aria-label=\"{{ o.aria }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:inline-flex;align-items:center;justify-content:center;width:44px;min-height:44px;padding:0;border-radius:8px;border:var(--bw) solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 0.9375rem/1.25rem var(--font-mono);cursor:pointer;transition:background 160ms var(--ease),color 160ms var(--ease)\">{{ o.v }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fli>\n          <\u002Fol>\n          <div style=\"display:flex;flex-direction:column;gap:40px;padding-top:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><h3 style=\"margin:0;font:600 1.25rem/1.75rem var(--font-sans)\">Shared answers<\u002Fh3><p style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">These come up in several steps. Answer once here and every step that needs them is filled in.<\u002Fp><\u002Fdiv>\n            <sc-for list=\"{{ wfShGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <fieldset style=\"border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;min-width:0\">\n                <leg  f.ex }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:{{ f.bwid }};border-color:{{ f.border }};background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans);resize:vertical\"><\u002Ftextarea><\u002Fsc-if>\n                      <sc-if value=\"{{ f.hasErr }}\"><p id=\"{{ f.errId }}\" style=\"margin:0;display:flex;gap:6px;align-items:flex-start;font:500 0.875rem/1.25rem var(--font-sans);color:var(--color-error)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;margin-top:2px\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18v.01\"><\u002Fpath><\u002Fsvg>{{ f.err }}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n                      <span style=\"font:400 0.75rem/1rem var(--font-sans);color:var(--color-text-muted)\">{{ f.use }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Ffieldset>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section id=\"wf-steps\" aria-labelledby=\"h-steps\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;max-width:64ch\">\n              <h2 id=\"h-steps\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">The 25 steps, in order<\u002Fh2>\n              <p style=\"margin:0;color:var(--color-text-muted)\">Open a step to add details only that step needs. Every field here is optional. Untick a step to leave it out.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ wfToggleAll }}\" style=\"wh ease)\" style-hover=\"background:var(--color-sunken)\">\n                          <span style=\"flex:none;white-space:nowrap;min-width:64px;align-self:flex-start;font:500 0.8125rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">{{ p.stepLabel }}<\u002Fspan>\n                          <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ p.title }}<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ p.use }}<\u002Fspan><\u002Fspan>\n                          \n                          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;color:var(--color-text-muted);transform:{{ p.rot }};transition:transform 240ms var(--ease)\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                        <\u002Fbutton>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ p.open }}\">\n                        <div id=\"{{ p.panelId }}\" style=\"display:flex;flex-direction:column;gap:24px;margin:0;padding:8px clamp(16px,3vw,24px) 24px clamp(16px,6vw,72px);animation:wfIn 240ms var(--ease)\">\n                          \n                          <sc-if value=\"{{ p.hasFields }}\"><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:24px 32px\">\n                            <sc-for list=\"{{ p.fields }}\" as=\"f\">\n                              <div style=\"display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:6px;align-content:start;min-width:0\">\n                                <label for=\"{{ f.id }}\" style=\"align-self:end;font:600 0.9375rem/1.25rem var(--font-sans)\">{{ f.label }}<\u002Flabel><div style=\"min-width:0\">\n                                <sc-if value=\"{{ f.long }}\"><textarea id=\"{{ f.id }}\" rows=\"3\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.hint }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:var(--bw);border-color:var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans);resize:vertical\"><\u002Ftextarea><\u002Fsc-if>\n                                <sc-if value=\"{{ f.short }}\"><textarea id=\"{{ f.id }}\" rows=\"2\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.hint }}\" style=\"width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border-style:solid;border-width:var(--bw);border-color:var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans);resize:vertical\"><\u002Ftextarea><\u002Fsc-if><\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv><\u002Fsc-if>\n                          <sc-if value=\"{{ p.noFields }}\"><p style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Nothing else needed. This step uses your answers above.<\u002Fp><\u002Fsc-if>\n                          <div style=\"display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 16px\">\n                            <sc-if value=\"{{ p.hasFields }}\"><button type=\"button\" sc-camel-on-click=\"{{ p.onClearStep }}\" style=\"white-space:nowrap;min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--color-text-muted);font:500 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Clear this step<\u002Fbutton><\u002Fsc-if>\n                            <button type=\"button\" sc-camel-on-click=\"{{ p.onCopyStep }}\" style=\"white-space:nowrap;min-height:44px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Copy this step only<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Fol>\n                <dl style=\"margin:0;padding:16px 24px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px 24px;background:var(--color-sunken);font:400 0.875rem/1.25rem var(--font-sans)\">\n                  <div style=\"display:flex;flex-direction:column;gap:4px\"><dt style=\"font-weight:600\">Carry forward<\u002Fdt><dd style=\"margin:0;color:var(--color-text-muted)\">{{ ph.carry }}<\u002Fdd><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:4px\"><dt style=\"font-weight:600\">Tip<\u002Fdt><dd style=\"margin:0;color:var(--color-text-muted)\">{{ ph.tip }}<\u002Fdd><\u002Fdiv>\n                <\u002Fdl>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fsection>\n        <section id=\"wf-output\" tabindex=\"-1\" aria-labelledby=\"h-output\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h2 id=\"h-output\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Check and export<\u002Fh2>\n            <p style=\"margin:0;color:var(--color-text-muted);max-width:64ch\">The file is checked against the anti-slop rules as you type. Em dashes are fixed for you; everything else is yours to rewrite.<\u002Fp>\n          <\u002Fdiv>\n          <ul style=\"list-style:none;margin:0;padding:0;border-top:var(--bw) solid var(--color-border)\">\n            <sc-for list=\"{{ wfLint }}\" as=\"x\" hint-placeholder-count=\" font-mono);color:var(--code-fg)\">{{ wfMd }}<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-labelledby=\"h-wf-file\" style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column\">\n        <div style=\"position:{{ asideSticky }};top:88px;display:flex;flex-direction:column;gap:20px;padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-2)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><h2 id=\"h-wf-file\" style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Your workflow file<\u002Fh2><p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);overflow-wrap:anywhere\">{{ wfFile }}<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;justify-content:space-between;gap:8px;font:400 0.875rem/1.25rem var(--font-sans)\"><span>{{ wfFilledText }}<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--color-text-muted)\">{{ wfPct }}<\u002Fspan><\u002Fdiv>\n            <div aria-hidden=\"true\" style=\"height:8px;border-radius:999px;background:var(--color-sunken);overflow:hidden\"><div style=\"height:100%;width:{{ wfPct }};border-radius:999px;background:var(--color-primary);transition:width 400ms var(--ease)\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ wfStepsText }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"margin-top:-12px;font:500 0.875rem/1.25rem var(--font-sans);color:{{ wfReqFg }}\">{{ wfReqText }}<\u002Fspan>\n          <sc-if value=\"{{ wfShowErrs }}\"><div role=\"alert\" style=\"display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:8px;border:2px solid var(--color-error);background:var(--color-error-soft)\"><strong style=\"font:600 0.9375rem/1. \">\n                <input type=\"radio\" name=\"wf-mode\" id=\"{{ o.id }}\" checked=\"{{ o.checked }}\" sc-camel-on-change=\"{{ o.onChange }}\" style=\"flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--color-primary)\">\n                <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\"><span style=\"display:flex;justify-content:space-between;gap:8px;font:600 0.9375rem/1.25rem var(--font-sans)\">{{ o.l }}<span style=\"flex:none;font:500 0.75rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ o.size }}<\u002Fspan><\u002Fspan><span style=\"font:400 0.8125rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ o.t }}<\u002Fspan><\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ wfCopy }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\"><sc-if value=\"{{ wfCopied }}\">Copied<\u002Fsc-if><sc-if value=\"{{ wfNotCopied }}\" hint-placeholder-val=\"{{ true }}\">Copy full markdown<\u002Fsc-if><\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ wfDownload }}\" style=\"min-height:48px;padding:0 20px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Download .md<\u002Fbutton>\n            <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ wfPreview }}\" style=\"min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Check and preview<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ wfReset }}\" style=\"min-height:44px;padding:0;border:0;background:transparent;color:var(--color-text-muted);font:500 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Clear all answers<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 0.8125rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Saved on this device as you type. Paste the file into Claude, ChatGPT, Cursor or any AI tool, then say \"start\".<\u002Fp>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ faqPage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-faq\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text)\">FAQ<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:40px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em;text-wrap:balance\">Questions, answered in plain words<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">How the site works, how to build a project with it, and what happens to your answers. No coding knowledge needed.<\u002Fp>\n    <\u002Fheader>\n    <section aria-labelledby=\"h-faq-how\" style=\"display:flex;flex-direction:column;gap:20px;margin-bottom:64px\">\n      <h2 id=\"h-faq-how\" style=\"margin:0;font:600 1.25rem/1.75rem var(--font-sans)\">The whole process in four steps<\u002Fh2>\n      <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px 32px\">\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-accent)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-accent)\">01<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Answer a few questions<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">On the Workflow page, describe your project. Only three answers are required.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-border-strong)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">02<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Pick your steps and rules<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Keep all 25 steps or untick the ones you don't need. Choose how many anti-slop rules to attach.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-border-strong)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">03<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Copy or download one file<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Everything lands in a single text file, checked against the rules as you type.<\u002Fspan><\u002Fli>\n        <li style=\"display:flex;flex-direction:column;gap:6px;padding-top:16px;border-top:2px solid var(--color-border-strong)\"><span style=\"font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">04<\u002Fspan><strong style=\"font:600 1.0625rem/1.5rem var(--font-sans)\">Paste it and say \"start\"<\u002Fstrong><span style=\"font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">Open Claude, ChatGPT or any AI chat, paste the file, and the AI works through it one step at a time.<\u002Fspan><\u002Fli>\n      <\u002Fol>\n      <a href=\"#/workflow\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:8px;background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-primary-hover)\">Start the workflow<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fsection>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div style=\"flex:3 1 600px;min-width:0;display:flex;flex-direction:column;gap:32px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <label for=\"faq-search\" style=\"font:600 1rem/1.5rem var(--font-sans)\">Search the questions<\u002Flabel>\n          <div style=\"position:relative\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"position:absolute;left:14px;top:14px;color:var(--color-text-muted);pointer-events:none\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n            <input id=\"faq-search\" type=\"search\" value=\"{{ faqQ }}\" sc-camel-on-change=\"{{ onFaqQ }}\" placeholder=\"e.g. attach files, dark mode, too long\" aria-describedby=\"faq-count\" style=\"width:100%;min-height:48px;padding:12px 16px 12px 44px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans)\">\n          <\u002Fdiv>\n          <div role=\"group\" aria-label=\"Filter by topic\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ faqTopics }}\" as=\"o\" hint-placeholder-count=\"6\"><button type=\"button\" aria-pressed=\"{{ o.pressed }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:var(--bw) solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 0.9375rem/1.25rem var(--font-sans);cursor:pointer;transition:background 160ms var(--ease),color 160ms var(--ease)\">{{ o.l }}<span style=\"font:500 0.75rem/1rem var(--font-mono);opacity:0.75\">{{ o.n }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px\">\n            <span id=\"faq-count\" aria-live=\"polite\" style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ faqCountText }}<\u002Fspan>\n            <sc-if value=\"{{ faqHasResults }}\"><button type=\"button\" sc-camel-on-click=\"{{ faqToggleAll }}\" style=\"min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:600 0.9375rem/1.5re lay:flex;flex-direction:column;gap:4px\">\n          <li><a href=\"#/workflow\" style=\"display:flex;flex-direction:column;gap:2px;padding:10px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">Build a whole project<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Workflow: answer once, export one file<\u002Fspan><\u002Fa><\u002Fli>\n          <li><a href=\"#/prompts\" style=\"display:flex;flex-direction:column;gap:2px;padding:10px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">Do one task<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Prompt library: copy a single prompt<\u002Fspan><\u002Fa><\u002Fli>\n          <li><a href=\"#/antislop\" style=\"display:flex;flex-direction:column;gap:2px;padding:10px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">Make AI output less generic<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Anti-slop rules: read or copy them<\u002Fspan><\u002Fa><\u002Fli>\n        <\u002Ful>\n        <p style=\"margin:0;font:400 0.8125rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Your answers stay in this browser. Nothing is sent to a server.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ antislopPage }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-antislop\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0
