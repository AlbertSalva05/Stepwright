  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

75rem var(--font-sans);color:var(--color-text-muted);max-width:52ch;text-wrap:pretty\">A curated collection of Claude prompts for frontend development. Each file gives Claude a specialist role for UI/UX design, web development or a frontend component, with the brackets marked for your project details.<\u002Fp>\n        <div class=\"hero-banner-actions\" style=\"display:flex;flex-wrap:wrap;gap:16px\">\n          <a href=\"#/prompts\" class=\"button-primary\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none;transition:background-color 160ms var(--ease)\" style-hover=\"background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:var(--color-on-primary)\">Browse the prompt library<\u002Fa>\n          <a href=\"#/prompts/design-system-generator\" class=\"button-secondary\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);text-decoration:none;transition:background-color 160ms var(--ease)\" style-hover=\"background:var(--color-sunken);color:var(--color-text)\">Start with the design system<\u002Fa>\n        <\u002Fdiv>\n        <p class=\"hero-banner-meta\" style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">25 prompt files · 7 folders · MIT licence<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"code-window\" style=\"flex:1 1 440px;min-width:0;max-width:100%;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface);box-shadow:var(--shadow-2);overflow:hidden\">\n        <div class=\"code-window-bar\" style=\"display:fle ght:44px;white-space:nowrap;color:{{ t.nameColor }};text-decoration:none\" style-hover=\"text-decoration:underline\">{{ t.name }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ t.notLink }}\"><span style=\"color:var(--code-fg)\">{{ t.name }}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                  <span style=\"color:var(--code-muted);white-space:nowrap\">{{ t.comment }}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ heroUsage }}\" hint-placeholder-val=\"{{ false }}\">\n          <div id=\"panel-usage\" role=\"tabpanel\" aria-labelledby=\"tab-usage\" tabindex=\"0\" class=\"code-window-body\" style=\"background:var(--code-bg);color:var(--code-fg);padding:24px\">\n            <ol class=\"usage-steps\" style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:24px;font:400 1rem/1.5rem var(--font-sans)\">\n              <li style=\"display:flex;gap:16px\"><span aria-hidden=\"true\" style=\"font:500 0.875rem/1.5rem var(--font-mono);color:var(--code-head)\">01<\u002Fspan><span>Browse the categories and open the folder that matches your task.<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:16px\"><span aria-hidden=\"true\" style=\"font:500 0.875rem/1.5rem var(--font-mono);color:var(--code-head)\">02<\u002Fspan><span>Choose a prompt that fits your needs.<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:16px\"><span aria-hidden=\"true\" style=\"font:500 0.875rem/1.5rem var(--font-mono);color:var(--code-head)\">03<\u002Fspan><span>Copy it and paste it into Claude.<\u002Fspan><\u002Fli>\n              <li style=\"display:flex;gap:16px\"><span aria-hidden=\"true\" style=\"font:500 0.875rem/1.5rem var(--font-mono);color:var(--code-head)\">04<\u002Fspan><span>Customize it for your project. Replace every <code style=\"font:500 0.875rem/1.5rem var(--font-mono);color:var(--code-ph)\">[BRACKETED]<\u002Fcode> value, or use the fill-in form on each prompt page.<\u002Fspan><\u002Fli>\n            <\u002Fol>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"workflow-teaser\" aria-labelledby=\"h-where\" style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,8vw,96px) clamp(16px,4vw,32px) 0\">\n    <div class=\"section-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:640px;margin-bottom:32px\">\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">workflow<\u002Fp>\n      <h2 id=\"h-where\" style=\"margin:0;font:600 clamp(1.5rem,3vw,2rem)/1.25 var(--font-sans);letter-spacing:-0.015em;text-wrap:balance\">Not sure where to start? Follow the eight phases<\u002Fh2>\n      <p style=\"margin:0;color:var(--color-text-muted);text-wrap:pretty\">The 25 prompts are numbered in the order a frontend project needs them. Prepare your brief first, then work through each phase and carry every output forward.<\u002Fp>\n    <\u002Fdiv>\n    <ol class=\"phase-list\" style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,256px),1fr));gap:16px\">\n      <sc-for list=\"{{ flow }}\" as=\"ph\" hint-placeholder-count=\"8\">\n        <li style=\"display:flex;flex-direction:column;gap:8px;padding:20px 24px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n          <span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">{{ ph.label }} · {{ ph.countLabel }}<\u002Fspan>\n          <span style=\"font:600 1.125rem/1.75rem var(--font-sans)\">{{ ph.title }}<\u002Fspan>\n          <span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ ph.goal }}<\u002Fspan>\n          <a href=\"{{ ph.first.href }}\" style=\"display:block;min-height:44px;padding:12px 0;margin-top:auto;font:500 0.875rem/1.25rem var(--font-sans);overflow-wrap:anywhere\"><span>Start: {{ ph.first.title }}<\u002Fspan><\u002Fa>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n    <div style=\"margin-top:24px\">\n      <a href=\"#/workflow\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-sunken);color:var(--color-text)\">Read the full workflow and prep checklist<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"category-index\" aria-labelledby=\"h-folders\" style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,8vw,96px) clamp(16px,4vw,32px) 0\">\n    <div class=\"section-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:640px;margin-bottom:32px\">\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">prompts/<\u002Fp>\n      <h2 id=\"h-folders\" style=\"margin:0;font:600 clamp(1.5rem,3vw,2rem)/1.25 var(--font-sans);letter-spacing:-0.015em;text-wrap:balance\">Seven folders, one for each frontend concern<\u002Fh2>\n      <p style=\"margin:0;color:var(--color-text-muted);text-wrap:pretty\">Each folder is a directory in the repository. Open one to see what it covers.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:flex-end;margin:-16px 0 8px\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAllCats }}\" style=\"white-space:nowrap;min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--color-primary);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer;text-decoration:underline;text-underline-offset:3px\">{{ allCatsLabel }}<\u002Fbutton><\u002Fdiv>\n    <sc-if value=\"{{ loadError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"alert\" class=\"state-error\" style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-error);background:var(--color-error-soft);color:var(--color-text)\">\n        <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--color-error);flex:none\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18v.01\"><\u002Fpath><\u002Fsvg>\n        <p style=\"margin:0;flex:1 1 240px\"><strong>The prompt files did not load.<\u002Fstrong> Check your connection, then try again.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ retry }}\" style=\"min-height:44px;padding:0 20px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\">Try loading again<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <ul class=\"category-list\" style=\"list-style:none;margin:0;padding:0;border-top:var(--bw) solid var(--color-border)\">\n      <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ skeleton3 }}\" as=\"k\"><li aria-hidden=\"true\" style=\"display:flex;gap:16px;padding:24px 0;border-bottom:var(--bw) solid var(--color-border)\"><span style=\"width:48px;height:48px;border-radius:8px;background:var(--color-sunken)\"><\u002Fspan><span style=\"flex:1;display:flex;flex-direction:column;gap:8px\"><span style=\"width:40%;height:16px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><span style=\"width:80%;height:16px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><\u002Fspan><\u002Fli><\u002Fsc-for>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"7\">\n        <li class=\"category-accordion\" style=\"border-bottom:var(--bw) solid var(--color-border)\">\n          <h3 style=\"margin:0\">\n            <button type=\"button\" id=\"{{ c.btnId }}\" aria-expanded=\"{{ c.expanded }}\" aria-controls=\"{{ c.panelId }}\" sc-camel-on-click=\"{{ c.onToggle }}\" style=\"width:100%;display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 8px;border:0;border-radius:8px;background:transparent;color:var(--color-text);text-align:left;cursor:pointer;transition:background 160ms var(--ease)\" style-hover=\"background:var(--color-sunken)\">\n              <span class=\"icon-tile\" aria-hidden=\"true\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:{{ c.tileBg }};color:{{ c.tileFg }};border:var(--bw) solid var(--color-border);transition:background 200ms var(--ease),color 200ms var(--ease)\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" focusable=\"false\"><sc-for list=\"{{ c.icon }}\" as=\"p\"><path d=\"{{ p }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg><\u002Fspan>\n              <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font:600 1.125rem/1.5rem var(--font-sans)\">{{ c.label }}<\u002Fspan>\n                <span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);overflow-wrap:anywhere\">{{ c.path }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"flex:none;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);padding:2px 10px;border-radius:999px;border:var(--bw) solid var(--color-border)\">{{ c.countShort }}<\u002Fspan>\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;color:var(--color-text-muted);transform:{{ c.rot }};transition:transform 280ms var(--ease)\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fh3>\n          <div id=\"{{ c.panelId }}\" role=\"region\" aria-labelledby=\"{{ c.btnId }}\" style=\"display:grid;grid-template-rows:{{ c.rows }};transition:{{ c.trans }}\">\n            <div style=\"min-height:0;overflow:hidden;visibility:{{ c.vis }}\">\n              <div style=\"display:flex;flex-direction:column;gap:16px;max-width:68ch;padding:8px 16px 32px clamp(16px,6vw,68px)\">\n                <p style=\"margin:0;font:400 1rem/1.625rem var(--font-sans);text-wrap:pretty\">{{ c.blurb }}<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <span style=\"font:500 0.75rem/1rem var(--font-mono);color:var(--color-text-muted)\">Covers<\u002Fspan>\n                  <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px\">\n                    <sc-for list=\"{{ c.topics }}\" as=\"tp\"><li style=\"white-space:nowrap;padding:4px 12px;border-radius:999px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);font:400 0.875rem/1.25rem var(--font-sans)\">{{ tp }}<\u002Fli><\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fdiv>\n                <a href=\"{{ c.href }}\" style=\"align-self:flex-start;display:inline-block;padding:10px 0;font:600 0.9375rem/1.5rem var(--font-sans);white-space:nowrap\">Browse {{ c.countLabel }}<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <section class=\"featured-prompt\" aria-labelledby=\"h-featured\" style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,8vw,96px) clamp(16px,4vw,32px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div style=\"flex:3 1 480px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n        <div class=\"section-heading\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">prompts/ui-design/design-system-generator.md<\u002Fp>\n          <h2 id=\"h-featured\" style=\"margin:0;font:600 clamp(1.5rem,3vw,2rem)/1.25 var(--font-sans);letter-spacing:-0.015em;text-wrap:balance\">New project? Start with the design system prompt<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:60ch;text-wrap:pretty\">It produces the tokens, type scale, spacing and component rules the other prompts can build on. Here are the first 11 of its 47 lines.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"code-window\" style=\"border-radius:12px;overflow:hidden;border:var(--bw) solid var(--color-border);background:var(--code-bg)\">\n          <div aria-hidden=\"true\" style=\"display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--code-bar);color:var(--code-muted);font:500 0.8125rem/1.25rem var(--font-mono)\">design-system-generator.md<\u002Fdiv>\n          <div class=\"code-lines\" style=\"padding:16px 0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--code-fg);overflow-x:auto\">\n            <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ true }}\"><div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:12px;padding:0 16px\"><span style=\"width:70%;height:12px;border-radius:4px;background:var(--code-bar)\"><\u002Fspan><span style=\"width:40%;height:12px;border-radius:4px;background:var(--code-bar)\"><\u002Fspan><span style=\"width:55%;height:12px;border-radius:4px;background:var(--code-bar)\"><\u002Fspan><\u002Fdiv><\u002Fsc-if>\n            <sc-for list=\"{{ featuredLines }}\" as=\"l\">\n              <div style=\"display:grid;grid-template-columns:48px minmax(0,1fr)\"><span aria-hidden=\"true\" style=\"text-align:right;padding-right:16px;color:var(--code-num);user-select:none\">{{ l.n }}<\u002Fspan><span style=\"white-space:pre-wrap;overflow-wrap:anywhere;padding-right:16px;color:{{ l.color }}\"><sc-for list=\"{{ l.segs }}\" as=\"g\"><span style=\"color:{{ g.fg }};background:{{ g.bg }};border-radius:2px\">{{ g.t }}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n          <a href=\"#/prompts/design-system-generator\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:var(--color-on-primary)\">Read and customize the full prompt<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-labelledby=\"h-next\" style=\"flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:12px;background:var(--color-sunken);border:var(--bw) solid var(--color-border)\">\n        <h3 id=\"h-next\" style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Then pick the prompt for your next step<\u002Fh3>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ shortlist }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <li style=\"border-top:var(--bw) solid var(--color-border)\"><a href=\"{{ p.href }}\" style=\"display:flex;flex-direction:column;gap:4px;padding:16px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ p.title }}<\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);overflow-wrap:anywhere\">{{ p.folder }}/ · {{ p.difficulty }}<\u002Fspan><\u002Fa><\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"route-map\" aria-labelledby=\"h-route\" style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,8vw,96px) clamp(16px,4vw,32px) 0\">\n    <div class=\"section-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:640px;margin-bottom:32px\">\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">route map<\u002Fp>\n      <h2 id=\"h-route\" style=\"margin:0;font:600 clamp(1.5rem,3vw,2rem)/1.25 var(--font-sans);letter-spacing:-0.015em;text-wrap:balance\">One route through a frontend build<\u002Fh2>\n      <p style=\"margin:0;color:var(--color-text-muted);text-wrap:pretty\">Seven stops, one per folder, in the order a project usually needs them. Play the tour, or select any stop to see what it covers and which files live there.<\u002Fp>\n    <\u002Fdiv>\n    <figure ref=\"{{ rmRef }}\" style=\"margin:0;border-radius:16px;border:var(--bw) solid var(--color-border);background:var(--color-surface);padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px\">\n        <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n          <span style=\"display:flex;align-items:baseline;gap:8px;white-space:nowrap;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">Route <span style=\"font:600 1.5rem/2rem var(--font-mono);color:var(--color-primary)\">{{ rm.n }}<\u002Fspan> of 07<\u002Fspan>\n        <\u002Fdiv>\n        <div role=\"group\" aria-label=\"Route tour\" style=\"display:flex;gap:8px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ rmPrev }}\" aria-label=\"Previous stop\" style=\"display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ rmToggle }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 0.9375rem/1.5rem var(--font-sans);white-space:nowrap;cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\">\n            <sc-if value=\"{{ rmPlaying }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n            <sc-if value=\"{{ rmPaused }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M7 5v14l12-7z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n            <span>{{ rmPlayLabel }}<\u002Fspan>\n          <\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ rmNext }}\" aria-label=\"Next stop\" style=\"display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg class=\"route-map-graphic\" sc-camel-view-box=\"{{ mapBox }}\" role=\"group\" aria-label=\"Route map stops\" style=\"display:block;width:100%;max-width:{{ mapMax }};margin:0 auto;height:auto;overflow:visible\">\n        <path d=\"{{ loopPath }}\" fill=\"none\" stroke-width=\"{{ loopW }}\" stroke-dasharray=\"6 8\" stroke-linecap=\"round\" style=\"stroke:var(--color-accent);opacity:{{ loopOp }};transition:opacity 400ms var(--ease);animation:routeMarch {{ loopSpeed }} linear infinite\"><\u002Fpath>\n        {{ loopLabel }}\n        <path d=\"{{ routePath }}\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--color-border)\"><\u002Fpath>\n        <path d=\"{{ routePath }}\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"{{ routeDash }}\" style=\"stroke:var(--color-primary);stroke-dashoffset:{{ routeOff }};transition:stroke-dashoffset 700ms var(--ease)\"><\u002Fpath>\n        <circle cx=\"0\" cy=\"0\" r=\"30\" style=\"fill:var(--color-accent-soft);transform:{{ trainT }};transition:transform 700ms var(--ease)\"><\u002Fcircle>\n        {{ trainPulse }}\n        <sc-for list=\"{{ stations }}\" as=\"s\">\n          <g class=\"route-map-station\" role=\"button\" tabindex=\"0\" aria-label=\"{{ s.aria }}\" aria-pressed=\"{{ s.pressed }}\" sc-camel-on-click=\"{{ s.onClick }}\" sc-camel-on-key-down=\"{{ s.onKey }}\" style=\"cursor:pointer\">\n            <circle cx=\"{{ s.x }}\" cy=\"{{ s.y }}\" r=\"28\" style=\"fill:transparent\"><\u002Fcircle>\n            <g style=\"transform-box:fill-box;transform-origin:center;transform:{{ s.scale }};transition:transform 300ms var(--ease)\">\n              <circle cx=\"{{ s.x }}\" cy=\"{{ s.y }}\" r=\"18\" stroke-width=\"3\" style=\"fill:{{ s.fill }};stroke:{{ s.stroke }};transition:fill 300ms var(--ease),stroke 300ms var(--ease)\"><\u002Fcircle>\n              {{ s.numEl }}\n            <\u002Fg>\n            {{ s.labelEl }}\n          <\u002Fg>\n        <\u002Fsc-for>\n      <\u002Fsvg>\n      <div aria-live=\"{{ rmLive }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 48px;padding-top:24px;border-top:var(--bw) solid var(--color-border)\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n          <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">{{ rm.id }}<\u002Fp>\n          <h3 style=\"margin:0;font:600 1.375rem/1.875rem var(--font-sans);text-wrap:balance\">{{ rm.why }}<\u002Fh3>\n          <p style=\"margin:0;text-wrap:pretty\">{{ rm.blurb }}<\u002Fp>\n          <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ rm.usedIn }}<\u002Fp>\n          <a href=\"{{ rm.href }}\" style=\"display:inline-block;padding:10px 0;font:600 0.9375rem/1.5rem var(--font-sans)\">Open {{ rm.label }} in the library<\u002Fa>\n        <\u002Fdiv>\n        <ul aria-label=\"{{ rm.filesLabel }}\" style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-width:0\">\n          <sc-for list=\"{{ rm.files }}\" as=\"f\">\n            <li style=\"border-top:var(--bw) solid var(--color-border)\"><a href=\"{{ f.href }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--color-text)\" style-hover=\"background:var(--color-sunken);color:var(--color-text)\"><span style=\"flex:1;min-width:0;font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-primary);overflow-wrap:anywhere\">{{ f.file }}<\u002Fspan><span style=\"flex:none;white-space:nowrap;font:500 0.75rem/1rem var(--font-mono);color:var(--color-text-muted)\">{{ f.stepLabel }}<\u002Fspan><\u002Fa><\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n      <figcaption style=\"display:flex;flex-wrap:wrap;gap:8px 24px;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">\n        <span style=\"display:inline-flex;align-items:center;gap:8px\"><svg width=\"32\" height=\"8\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M2 4h28\" stroke-width=\"6\" stroke-linecap=\"round\" style=\"stroke:var(--color-primary)\"><\u002Fpath><\u002Fsvg>Build order<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:8px\"><svg width=\"32\" height=\"8\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M2 4h28\" stroke-width=\"2\" stroke-dasharray=\"6 8\" style=\"stroke:var(--color-accent)\"><\u002Fpath><\u002Fsvg>Audit loop: accessibility findings go back to UI design<\u002Fspan>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section class=\"new-prompts\" aria-labelledby=\"h-new\" style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,8vw,96px) clamp(16px,4vw,32px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px 48px;padding:clamp(24px,4vw,48px);border-radius:16px;background:var(--color-primary-soft);border:var(--bw) solid var(--color-border)\">\n      <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px;align-items:flex-start\">\n        <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-accent)\">v1.1.0<\u002Fp>\n        <h2 id=\"h-new\" style=\"margin:0;font:600 clamp(1.5rem,3vw,2rem)/1.25 var(--font-sans);letter-spacing:-0.015em;text-wrap:balance\">Every topic in the README now has a prompt<\u002Fh2>\n        <p style=\"margin:0;color:var(--color-text-muted);text-wrap:pretty\">Sixteen new files cover Vue and Angular components, journey maps, loading states, keyboard audits and more. They use the same format as the original nine and are marked Beta while they get real-world use.<\u002Fp>\n        <a href=\"#/prompts\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:var(--color-on-primary)\">Open the prompt library<\u002Fa>\n      <\u002Fdiv>\n      <ul aria-label=\"Some of the new prompts\" style=\"flex:1 1 360px;min-width:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ homeNew }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <li><a href=\"{{ p.href }}\" style=\"display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:8px;background:var(--color-surface);border:var(--bw) solid var(--color-border);text-decoration:none;color:var(--color-text)\" style-hover=\"border-color:var(--color-border-strong);color:var(--color-primary)\"><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ p.title }}<\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);overflow-wrap:anywhere\">{{ p.path }}<\u002Fspan><\u002Fa><\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ library }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-library\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text)\">Prompts<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:32px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em\">Prompt library<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">Search the titles, tags and full prompt text, or narrow the list by folder and level.<\u002Fp>\n    <\u002Fheader>\n    <form role=\"search\" class=\"search-field\" sc-camel-on-submit=\"{{ onSearchSubmit }}\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:24px\">\n      <label for=\"search-input\" style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Search prompts<\u002Flabel>\n      <div style=\"position:relative;display:flex;align-items:center\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"position:absolute;left:16px;color:var(--color-text-muted);pointer-events:none\"><path d=\"M11 11m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0\"><\u002Fpath><path d=\"M16 16l4.5 4.5\"><\u002Fpath><\u002Fsvg>\n        <input id=\"search-input\" type=\"search\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Try tokens, aria or persona\" autocomplete=\"off\" aria-describedby=\"result-count\" style=\"width:100%;min-height:52px;padding:0 56px 0 48px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:400 1rem/1.5rem var(--font-sans)\" style-focus=\"border-color:var(--color-primary)\">\n        <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ clearQuery }}\" aria-label=\"Clear search\" style=\"position:absolute;right:4px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--color-text);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fform>\n    <div class=\"filter-bar\" style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:24px\">\n      <div role=\"group\" aria-labelledby=\"lbl-folder\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n        <span id=\"lbl-folder\" style=\"font:600 0.875rem/1.25rem var(--font-sans);min-width:56px\">Folder<\u002Fspan>\n        <sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <button type=\"button\" class=\"filter-chip\" aria-pressed=\"{{ c.pressed }}\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:500 0.875rem/1.25rem var(--font-mono);cursor:pointer\">{{ c.label }}<span style=\"font-size:0.75rem;opacity:.85\">{{ c.count }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div role=\"group\" aria-labelledby=\"lbl-level\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n        <span id=\"lbl-level\" style=\"font:600 0.875rem/1.25rem var(--font-sans);min-width:56px\">Level<\u002Fspan>\n        <sc-for list=\"{{ diffOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n          <button type=\"button\" class=\"filter-chip\" aria-pressed=\"{{ o.pressed }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 0.875rem/1.25rem var(--font-sans);cursor:pointer\">{{ o.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div role=\"group\" aria-labelledby=\"lbl-sort\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n        <span id=\"lbl-sort\" style=\"font:600 0.875rem/1.25rem var(--font-sans);min-width:56px\">Order<\u002Fspan>\n        <sc-for list=\"{{ sortOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n          <button type=\"button\" class=\"filter-chip\" aria-pressed=\"{{ o.pressed }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;border:var(--bw) solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 0.875rem/1.25rem var(--font-sans);cursor:pointer\">{{ o.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <a href=\"#/workflow\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font:500 0.875rem/1.25rem var(--font-sans)\">Why this order?<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p id=\"result-count\" role=\"status\" aria-live=\"polite\" style=\"margin:0 0 24px;padding-top:16px;border-top:var(--bw) solid var(--color-border);font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ resultText }}<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div class=\"results\" style=\"flex:3 1 560px;min-width:0\">\n        <sc-if value=\"{{ loadError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div role=\"alert\" class=\"state-error\" style=\"dis
