direction:column;gap:4px;padding:16px;border-radius:8px;border:var(--bw) solid var(--color-border);text-decoration:none;color:var(--color-text);text-align:right\" style-hover=\"border-color:var(--color-border-strong)\"><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Next<\u002Fspan><span style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ as.next.label }}<\u002Fspan><\u002Fa>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <aside class=\"side-column\" aria-label=\"About this file\" style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n        <nav aria-labelledby=\"h-as-toc\" style=\"padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\">\n          <h2 id=\"h-as-toc\" style=\"margin:0 0 8px;padding:0 8px;font:600 1rem/1.5rem var(--font-sans)\">Sections in this file<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ as.toc }}\" as=\"h\"><li><button type=\"button\" sc-camel-on-click=\"{{ h.onClick }}\" style=\"display:flex;align-items:center;width:100%;min-height:44px;padding:4px 8px;border:0;border-radius:4px;background:transparent;color:var(--color-primary);font:500 0.9375rem/1.25rem var(--font-sans);text-align:left;cursor:pointer\" style-hover=\"background:var(--color-sunken)\">{{ h.t }}<\u002Fbutton><\u002Fli><\u002Fsc-for><\u002Ful>\n        <\u002Fnav>\n        <section aria-labelledby=\"h-as-other\" style=\"display:flex;flex-direction:column;gap:8px\">\n          <h2 id=\"h-as-other\" style=\"margin:0;font:600 1rem/1.5rem var(--font-sans)\">Other files<\u002Fh2>\n          <ul style=\"list-style:none;margin:0;padding:0\"><sc-for list=\"{{ as.others }}\" as=\"o\"><li style=\"border-top:var(--bw) solid var(--color-border)\"><a href=\"{{ o.href }}\" style=\"display:flex;flex-direction:column;gap:4px;padding:12px 0;text-decoration:none;color:var(--color-text)\" style-hover=\"color:var(--color-primary)\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">{{ o.label }}<\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ o.file }}<\u002Fspan><\u002Fa><\u002Fli><\u002Fsc-for><\u002Ful>\n        <\u002Fsection>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ is404 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-not-found\" style=\"max-width:800px;margin:0 auto;padding:clamp(48px,10vw,120px) clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:24px\">\n    <p style=\"margin:0;font:500 0.875rem/1.25rem var(--font-mono);color:var(--color-accent)\">Error 404<\u002Fp>\n    <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,5vw,3rem)/1.2 var(--font-sans);letter-spacing:-0.02em;text-wrap:balance\">This page is not in the collection<\u002Fh1>\n    <p style=\"margin:0;padding:16px;border-radius:8px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);font:400 0.9375rem/1.5rem var(--font-mono);overflow-wrap:anywhere\">No file at {{ notFoundPath }}<\u002Fp>\n    <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">The link may be out of date, or the prompt may have moved to another folder. Search the library to find it again.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n      <a href=\"#/prompts\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-primary-hover);color:var(--color-on-primary)\">Search the prompt library<\u002Fa>\n      <a href=\"#/\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans);text-decoration:none\" style-hover=\"background:var(--color-sunken);color:var(--color-text)\">Back to the home page<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ system }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page-design-system\" style=\"max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,32px) clamp(64px,8vw,96px)\">\n    <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\"><ol style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;list-style:none;margin:0 0 16px;padding:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\"><li><a href=\"#/\" style=\"display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary)\">Home<\u002Fa><\u002Fli><li aria-hidden=\"true\" style=\"font-family:var(--font-mono)\">/<\u002Fli><li aria-current=\"page\" style=\"color:var(--color-text)\">Design system<\u002Fli><\u002Fol><\u002Fnav>\n    <header class=\"page-heading\" style=\"display:flex;flex-direction:column;gap:8px;max-width:720px;margin-bottom:40px\">\n      <h1 id=\"page-title\" tabindex=\"-1\" style=\"margin:0;font:600 clamp(2rem,4vw,2.5rem)/1.2 var(--font-sans);letter-spacing:-0.02em\">Design system<\u002Fh1>\n      <p style=\"margin:0;font:400 1.125rem/1.75rem var(--font-sans);color:var(--color-text-muted);text-wrap:pretty\">The tokens, type, spacing and component states behind this site, documented for handover to Figma and code. Layer names match the kebab-case class names in the source.<\u002Fp>\n      <p style=\"margin:0;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">v1.3.0 · primitives → semantic tokens → components<\u002Fp>\n    <\u002Fheader>\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start\">\n      <div class=\"ds-body\" style=\"flex:3 1 600px;min-width:0;display:flex;flex-direction:column;gap:80px\">\n        <section id=\"ds-decisions\" tabindex=\"-1\" aria-labelledby=\"h-ds-decisions\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-decisions\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Decision log<\u002Fh2>\n          <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:24px\">\n            <sc-for list=\"{{ decisions }}\" as=\"x\" hint-placeholder-count=\"8\"><div style=\"display:flex;flex-direction:column;gap:4px;padding-top:16px;border-top:2px solid var(--color-text)\"><dt style=\"font:600 1rem/1.5rem var(--font-sans)\">{{ x.k }}<\u002Fdt><dd style=\"margin:0;color:var(--color-text-muted);font:400 0.9375rem/1.5rem var(--font-sans)\">{{ x.v }}<\u002Fdd><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdl>\n        <\u002Fsection>\n\n        <section id=\"ds-logo\" tabindex=\"-1\" aria-labelledby=\"h-ds-logo\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-logo\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Logo lockups<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">The Stepwright mark is an S that climbs one stair in the middle: each prompt is a step. It is built on a 32px grid with right angles only and reads the same turned 180°. Keep clear space equal to the tile corner radius (9px at 40px) on every side, never go below 16px, and never place the light lockup on a dark ground.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px\">\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:#f6f4ef;border:var(--bw) solid var(--color-border)\"><img src=\"05423724-fd15-41ca-8dcc-8b5e0740115d\" alt=\"Stepwright lockup, light version\" width=\"280\" height=\"40\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_lockup_light_01.svg<\u002Fspan><a href=\"assets/logo/logo_lockup_light_01.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:#161513;border:var(--bw) solid var(--color-border)\"><img src=\"6a5d0a64-a6ad-4f34-88ce-3079fe366067\" alt=\"Stepwright lockup, dark version\" width=\"280\" height=\"40\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_lockup_dark_02.svg<\u002Fspan><a href=\"assets/logo/logo_lockup_dark_02.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:#ffffff;border:2px solid #000000\"><img src=\"58e8701f-f32c-4101-9aa6-e489d021eb98\" alt=\"Stepwright lockup, one-color version\" width=\"280\" height=\"40\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_lockup_mono_03.svg<\u002Fspan><a href=\"assets/logo/logo_lockup_mono_03.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n            <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\"><div style=\"display:flex;align-items:center;justify-content:center;min-height:128px;padding:24px;border-radius:12px;background:var(--color-sunken);border:var(--bw) solid var(--color-border)\"><img src=\"b36dd217-f966-4a9f-8e80-0660fbd7635a\" alt=\"Stepwright mark\" width=\"64\" height=\"64\" loading=\"lazy\"><\u002Fdiv><figcaption style=\"display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 0.8125rem/1.25rem var(--font-mono)\"><span>logo_mark_01.svg<\u002Fspan><a href=\"assets/logo/logo_mark_01.svg\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px\">Download<\u002Fa><\u002Ffigcaption><\u002Ffigure>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ds-color\" tabindex=\"-1\" aria-labelledby=\"h-ds-color\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-color\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Color<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">Primitives are raw values and are never used in components. Components read semantic tokens only, which is how the dark and high-contrast themes swap without touching markup.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px\">\n            <sc-for list=\"{{ prims }}\" as=\"c\" hint-placeholder-count=\"20\"><li style=\"display:flex;flex-direction:column;gap:8px\"><span aria-hidden=\"true\" style=\"height:56px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:{{ c.hex }}\"><\u002Fspan><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">{{ c.name }}<\u002Fspan><span style=\"font:400 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ c.hex }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <div role=\"region\" aria-label=\"Semantic tokens\" tabindex=\"0\" style=\"overflow-x:auto;border-radius:12px;border:var(--bw) solid var(--color-border)\">\n            <sc-raw-table style=\"width:100%;min-width:640px;border-collapse:collapse;font:400 0.875rem/1.25rem var(--font-sans)\">\n              <sc-raw-thead><sc-raw-tr style=\"background:var(--color-sunken);text-align:left\"><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Token<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Role<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Light<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">Dark<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"padding:12px 16px\">High contrast<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody><sc-for list=\"{{ semantic }}\" as=\"t\"><sc-raw-tr style=\"border-top:var(--bw) solid var(--color-border)\"><sc-raw-th scope=\"row\" style=\"padding:12px 16px;text-align:left;font:500 0.8125rem/1.25rem var(--font-mono)\">{{ t.token }}<\u002Fsc-raw-th><sc-raw-td style=\"padding:12px 16px\">{{ t.role }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px;font-family:var(--font-mono)\">{{ t.light }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px;font-family:var(--font-mono)\">{{ t.dark }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:12px 16px;font-family:var(--font-mono)\">{{ t.contrast }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Checked pairs (light theme): text on bg 15.3:1, muted text on bg 6.7:1, primary on bg 6.6:1, on-primary text on primary 7.1:1, accent on bg 5.6:1, every status badge 5.5:1 or higher, border-strong on bg 3.3:1 for control edges. Dark theme: every pair 5.7:1 or higher. High contrast: 11:1 or higher.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"ds-type\" tabindex=\"-1\" aria-labelledby=\"h-ds-type\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-type\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Typography<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">Base 16px with line heights on a 4px baseline. Sizes are in rem, so the three visitor text sizes (100%, 112.5%, 125%) scale every style together. Three weights only: 400, 500, 600.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"9\"><li style=\"display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0;border-top:var(--bw) solid var(--color-border);align-items:baseline\"><span style=\"flex:0 0 200px;display:flex;flex-direction:column;gap:2px;font:400 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\"><span style=\"font-weight:500;color:var(--color-text)\">{{ t.token }}<\u002Fspan><span>{{ t.size }} / {{ t.lh }}<\u002Fspan><span>weight {{ t.weight }} · tracking {{ t.tracking }}<\u002Fspan><\u002Fspan><span style=\"flex:1 1 280px;min-width:0;overflow-wrap:anywhere;font:{{ t.css }}\">{{ t.sample }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <div style=\"padding:24px;border-radius:12px;background:var(--color-sunken);border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Font licences<\u002Fh3>\n            <p style=\"margin:0\">IBM Plex Sans and IBM Plex Mono are licensed under the SIL Open Font License 1.1. You may use, embed, self-host and modify them on the web and in apps at no cost. You may not sell the font files on their own. Loaded from Google Fonts with font-display: swap; self-hosting the WOFF2 files works the same way.<\u002Fp>\n            <a href=\"https://openfontlicense.org\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:44px;align-self:flex-start\">Read the SIL Open Font License<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section id=\"ds-space\" tabindex=\"-1\" aria-labelledby=\"h-ds-space\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-space\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Spacing<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">An 8px grid. The 4px half step is only for icon-to-label gaps. Spacing stays in px so it does not grow with the text size setting; text reflows instead.<\u002Fp>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ space }}\" as=\"x\" hint-placeholder-count=\"8\"><li style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 0;border-top:var(--bw) solid var(--color-border)\"><span style=\"flex:0 0 136px;font:500 0.8125rem/1.25rem var(--font-mono)\">{{ x.token }} · {{ x.px }}px<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none;height:16px;border-radius:2px;background:var(--color-accent);width:{{ x.w }}\"><\u002Fspan><span style=\"flex:1 1 200px;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">{{ x.use }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section id=\"ds-grid\" tabindex=\"-1\" aria-labelledby=\"h-ds-grid\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-grid\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Grid and breakpoints<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">Mobile first. Columns wrap when content needs the room (flex-basis and auto-fill grids), so there are no dead zones between breakpoints. Container max width 1200px.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px\">\n            <div style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Mobile<\u002Fh3><p style=\"margin:0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">320 to 767px<br>4 columns<br>16px gutter, 16px margin<\u002Fp><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Tablet<\u002Fh3><p style=\"margin:0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">768 to 1023px<br>8 columns<br>24px gutter, 24px margin<\u002Fp><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);display:flex;flex-direction:column;gap:8px\"><h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Desktop<\u002Fh3><p style=\"margin:0;font:400 0.875rem/1.5rem var(--font-mono);color:var(--color-text-muted)\">1024px and up<br>12 columns<br>24px gutter, 32px margin<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ds-elevation\" tabindex=\"-1\" aria-labelledby=\"h-ds-elevation\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-elevation\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Elevation and radius<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:24px\">\n            <div style=\"padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">--shadow-1<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Resting cards in a list. Just enough to lift them off the page.<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">--shadow-2<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Code windows, the one focal object per screen.<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:24px;border-radius:12px;background:var(--color-surface);border:var(--bw) solid var(--color-border);box-shadow:var(--shadow-3);display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono)\">--shadow-3<\u002Fspan><span style=\"font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Popovers, dialogs and toasts that sit above everything.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Radius: 4px badges and line highlights, 8px controls, 12px cards and windows, 16px feature panels. The high-contrast theme removes shadows and uses 2px borders instead.<\u002Fp>\n        <\u002Fsection>\n\n        <section id=\"ds-components\" tabindex=\"-1\" aria-labelledby=\"h-ds-components\" style=\"display:flex;flex-direction:column;gap:32px\">\n          <h2 id=\"h-ds-components\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Components and states<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">button-primary and button-secondary<\u002Fh3>\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans)\">Default<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary-hover);background:var(--color-primary-hover);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans)\">Hover<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);outline:3px solid var(--color-focus);outline-offset:2px\">Focus<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) dashed var(--color-border-strong);background:var(--color-sunken);color:var(--color-text-muted);font:600 1rem/1.5rem var(--font-sans)\">Disabled<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 1rem/1.5rem var(--font-sans)\">Secondary<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Minimum height 48px for page actions, 44px for inline controls. Disabled uses a dashed edge as well as a muted color, so the state does not rely on color alone.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">status-badge: four availability states<\u002Fh3>\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n              <sc-for list=\"{{ statuses }}\" as=\"st\" hint-placeholder-count=\"4\"><span class=\"status-badge\" style=\"display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:2px 8px;border-radius:4px;background:{{ st.bg }};color:{{ st.fg }};font:600 0.8125rem/1.25rem var(--font-sans)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><sc-for list=\"{{ st.icon }}\" as=\"sp\"><path d=\"{{ sp }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>{{ st.label }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Each state has its own icon and label. Color is the third signal, never the only one.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">form-field<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Default<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-bg);color:var(--color-text-muted)\">Brand name<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Focus<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-bg);outline:3px solid var(--color-focus);outline-offset:2px\">TechFlow<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Error<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:2px solid var(--color-error);background:var(--color-bg)\">name@<\u002Fspan><span style=\"font:500 0.875rem/1.25rem var(--font-sans);color:var(--color-error)\">Error: Check the email format.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 0.9375rem/1.5rem var(--font-sans)\">Disabled<\u002Fspan><span style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:8px;border:var(--bw) dashed var(--color-border-strong);background:var(--color-sunken);color:var(--color-text-muted)\">Not editable<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Content states<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">loading<\u002Fspan><div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\"><span style=\"width:60%;height:12px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><span style=\"width:90%;height:20px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><span style=\"width:100%;height:40px;border-radius:4px;background:var(--color-sunken)\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">empty<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:12px;border:var(--bw) dashed var(--color-border-strong);background:var(--color-surface)\"><strong>No prompts in this folder yet<\u002Fstrong><span style=\"color:var(--color-text-muted);font-size:0.875rem;line-height:1.25rem\">Say what the empty space means, then offer one next step.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">error<\u002Fspan><div style=\"display:flex;gap:12px;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-error);background:var(--color-error-soft)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"flex:none;color:var(--color-error);margin-top:2px\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><path d=\"M12 10v5\"><\u002Fpath><path d=\"M12 18v.01\"><\u002Fpath><\u002Fsvg><span><strong>Files did not load.<\u002Fstrong> Name the cause, then give a retry.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">long text<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface);min-width:0\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);overflow-wrap:anywhere\">prompts/accessibility/screen-reader-optimization-for-data-tables.md<\u002Fspan><strong style=\"font-size:1.125rem;line-height:1.75rem;overflow-wrap:anywhere\">Screen Reader Optimization for Sortable, Filterable Data Tables With Sticky Headers<\u002Fstrong><span style=\"color:var(--color-text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden\">Titles wrap and never truncate. Paths break anywhere. Summaries clamp to three lines on cards and show in full on the prompt page, so nothing is lost.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">missing image<\u002Fspan><div style=\"display:flex;flex-direction:column;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface);overflow:hidden\"><div role=\"img\" aria-label=\"Image not available\" style=\"display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;background:repeating-linear-gradient(135deg,var(--color-sunken) 0 8px,var(--color-bg) 8px 16px);font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted);padding:16px;text-align:center\">img_prompt_cover_01.jpg<br>image not available<\u002Fdiv><div style=\"padding:16px\"><strong>The card keeps its shape<\u002Fstrong><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">See each pattern live<\u002Fh3>\n            <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 24px\">\n              <li><button type=\"button\" sc-camel-on-click=\"{{ openNotice }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:500 1rem/1.5rem var(--font-sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Notice modal<\u002Fbutton><\u002Fli>\n              <li><a href=\"{{ noResultsDemo }}\" style=\"display:inline-flex;align-items:center;min-height:44px\">Search with no results<\u002Fa><\u002Fli>\n                            <li><a href=\"#/prompts/design-system-generator\" style=\"display:inline-flex;align-items:center;min-height:44px\">Breadcrumbs and side column<\u002Fa><\u002Fli>\n              <li><a href=\"#/this-page-does-not-exist\" style=\"display:inline-flex;align-items:center;min-height:44px\">404 page<\u002Fa><\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ds-icons\" tabindex=\"-1\" aria-labelledby=\"h-ds-icons\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-icons\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Icons<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-text-muted);max-width:68ch\">24px grid, 1.75px stroke, round caps. Category icons use the prefix icn_category_, interface icons use icn_ui_. Every file uses currentColor in code and #1f1d1a in the exported SVG.<\u002Fp>\n          <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Category icons<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px\">\n            <sc-for list=\"{{ catIcons }}\" as=\"i\" hint-placeholder-count=\"7\"><li style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--color-primary)\"><sc-for list=\"{{ i.paths }}\" as=\"p\"><path d=\"{{ p }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg><span style=\"font:500 0.75rem/1rem var(--font-mono);overflow-wrap:anywhere\">{{ i.file }}<\u002Fspan><a href=\"{{ i.src }}\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:0.875rem\">Download SVG<\u002Fa><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n          <h3 style=\"margin:0;font:600 1.125rem/1.75rem var(--font-sans)\">Interface icons<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px\">\n            <sc-for list=\"{{ uiIcons }}\" as=\"i\" hint-placeholder-count=\"14\"><li style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:12px;border:var(--bw) solid var(--color-border);background:var(--color-surface)\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><sc-for list=\"{{ i.paths }}\" as=\"p\"><path d=\"{{ p }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg><span style=\"font:500 0.75rem/1rem var(--font-mono);overflow-wrap:anywhere\">{{ i.file }}<\u002Fspan><a href=\"{{ i.src }}\" download=\"\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:0.875rem\">Download SVG<\u002Fa><\u002Fli><\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section id=\"ds-log\" tabindex=\"-1\" aria-labelledby=\"h-ds-log\" style=\"display:flex;flex-direction:column;gap:24px\">\n          <h2 id=\"h-ds-log\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Build log<\u002Fh2>\n          <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n            <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"6\"><li style=\"display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0;border-top:var(--bw) solid var(--color-border)\"><span style=\"flex:0 0 120px;font:600 1rem/1.5rem var(--font-sans)\">{{ p.n }}<\u002Fspan><span style=\"flex:0 0 80px;font:500 0.8125rem/1.5rem va ont:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">v2.1.0 · MIT licence · updated 7 Oct 2026<\u002Fp>\n    <\u002Fdiv>\n    <nav aria-label=\"Footer\" style=\"flex:0 1 auto\">\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 24px\">\n        <li><a href=\"#/prompts\" style=\"display:inline-flex;align-items:center;min-height:44px\">Prompt library<\u002Fa><\u002Fli>\n                <li><a href=\"#/workflow\" style=\"display:inline-flex;align-items:center;min-height:44px\">Project workflow<\u002Fa><\u002Fli>\n        <li><a href=\"#/antislop\" style=\"display:inline-flex;align-items:center;min-height:44px\">Anti-slop rules<\u002Fa><\u002Fli>\n        <li><a href=\"#/design-system\" style=\"display:inline-flex;align-items:center;min-height:44px\">Design system<\u002Fa><\u002Fli>\n        <li><a href=\"#/faq\" style=\"display:inline-flex;align-items:center;min-height:44px\">FAQ<\u002Fa><\u002Fli>\n        <li><button type=\"button\" sc-camel-on-click=\"{{ openNotice }}\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:transparent;color:var(--color-primary);font:400 1rem/1.5rem var(--font-sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer\">Placeholder notice<\u002Fbutton><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ modeInfoOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ modeInfoBackdrop }}\" style=\"position:fixed;inset:0;z-index:80;background:var(--color-overlay);display:grid;place-items:center;padding:16px\">\n    <div ref=\"{{ modeInfoRef }}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mi-title\" aria-describedby=\"mi-desc\" style=\"width:min(820px,100%);height:min(640px,calc(100dvh - 32px));overflow:hidden;background:var(--color-surface);border:var(--bw) solid var(--color-border);border-radius:12px;box-shadow:var(--shadow-3);display:flex;flex-direction:column\">\n      <div style=\"flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:clamp(20px,4vw,28px) clamp(20px,4vw,32px) 16px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <h2 id=\"mi-title\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Which rules should you attach?<\u002Fh2>\n          <p id=\"mi-desc\" style=\"margin:0;color:var(--color-text-muted);text-wrap:pretty\">Anti-slop rules tell the AI what to avoid: vague wording, generic layouts, look-alike designs and sloppy code. Pick how much of them goes into your file. The rest of the file (your answers and the 25 steps) stays the same.<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeModeInfo }}\" aria-label=\"Close\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-8px -8px 0 0;border:0;border-radius:8px;background:transparent;color:var(--color-text);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <div tabindex=\"0\" aria-label=\"Options\" style=\"flex:1;min-height:0;overflow:auto;padding:4px clamp(20px,4vw,32px) 16px;overscroll-behavior:contain\"><ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px\">\n        <sc-for list=\"{{ wfModeInfo }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <li style=\"display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:12px;border-style:solid;border-width:{{ m.bw }};border-color:{{ m.border }}\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px\">\n              <h3 style=\"margin:0;font:600 1.125rem/1.5rem var(--font-sans)\">{{ m.l }}<\u002Fh3>\n              <span style=\"display:flex;align-items:center;gap:8px;font:500 0.8125rem/1.25rem var(--font-mono);color:var(--color-text-muted)\">{{ m.size }}<sc-if value=\"{{ m.current }}\"><span style=\"font:600 0.75rem/1rem var(--font-sans);padding:2px 8px;border-radius:999px;background:var(--color-accent-soft);color:var(--color-accent)\">Selected<\u002Fspan><\u002Fsc-if><\u002Fspan>\n            <\u002Fdiv>\n            <dl style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 32px\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><dt style=\"font:600 0.875rem/1.25rem var(--font-sans)\">What's included<\u002Fdt><dd style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">{{ m.inc }}<\u002Fdd><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><dt style=\"font:600 0.875rem/1.25rem var(--font-sans)\">For your current steps<\u002Fdt><dd style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">{{ m.files }}<\u002Fdd><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><dt style=\"font:600 0.875rem/1.25rem var(--font-sans)\">What you'll get<\u002Fdt><dd style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">{{ m.out }}<\u002Fdd><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><dt style=\"font:600 0.875rem/1.25rem var(--font-sans)\">Best when<\u002Fdt><dd style=\"margin:0;font:400 0.9375rem/1.5rem var(--font-sans);color:var(--color-text-muted)\">{{ m.best }}<\u002Fdd><\u002Fdiv>\n            <\u002Fdl>\n            <sc-if value=\"{{ m.notCurrent }}\"><button type=\"button\" sc-camel-on-click=\"{{ m.onPick }}\" style=\"align-self:flex-start;min-height:44px;padding:0 16px;border-radius:8px;border:var(--bw) solid var(--color-border-strong);background:var(--color-surface);color:var(--color-text);font:600 0.9375rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-sunken)\">Use this option<\u002Fbutton><\u002Fsc-if>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol><\u002Fdiv>\n      <div style=\"flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:16px clamp(20px,4vw,32px);border-top:var(--bw) solid var(--color-border)\">\n        <p style=\"margin:0;flex:1 1 260px;font:400 0.875rem/1.25rem var(--font-sans);color:var(--color-text-muted)\">Not sure? Combined summary works for most projects. You can switch any time; the file updates straight away.<\u002Fp>\n        <button type=\"button\" data-autofocus=\"true\" sc-camel-on-click=\"{{ closeModeInfo }}\" style=\"min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\">Got it<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noticeOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"notice-modal-overlay\" style=\"position:fixed;inset:0;z-index:80;background:var(--color-overlay);display:flex;align-items:center;justify-content:center;padding:16px\">\n    <div ref=\"{{ noticeRef }}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"notice-title\" aria-describedby=\"notice-desc\" class=\"notice-modal\" style=\"width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:var(--color-surface);border:var(--bw) solid var(--color-border);border-radius:12px;box-shadow:var(--shadow-3);padding:clamp(20px,5vw,32px);display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n        <h2 id=\"notice-title\" style=\"margin:0;font:600 1.5rem/2rem var(--font-sans)\">Before you paste a prompt<\u002Fh2>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeNotice }}\" aria-label=\"Close notice\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-8px -8px 0 0;border:0;border-radius:8px;background:transparent;color:var(--color-text);cursor:pointer\" style-hover=\"background:var(--color-sunken)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"notice-desc\" style=\"display:flex;flex-direction:column;gap:16px\">\n        <p style=\"margin:0\">Every prompt has values in <code style=\"font:500 0.9375rem/1.5rem var(--font-mono);color:var(--color-accent)\">[BRACKETS]<\u002Fcode>. Replace them with your project details before you send it, or use the fill-in form on each prompt page.<\u002Fp>\n        <p style=\"margin:0;color:var(--color-text-muted)\">Files marked Beta or Under revision are still changing. Each prompt page explains its status.<\u002Fp>\n      <\u002Fdiv>\n      <button type=\"button\" data-autofocus=\"true\" sc-camel-on-click=\"{{ closeNotice }}\" style=\"align-self:flex-start;min-height:48px;padding:0 24px;border-radius:8px;border:var(--bw) solid var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);font:600 1rem/1.5rem var(--font-sans);cursor:pointer\" style-hover=\"background:var(--color-primary-hover)\">Understood<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div role=\"status\" aria-live=\"polite\" class=\"toast-region\" style=\"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;width:max-content;max- $/i,'');if(pre.trim())buf.push(pre);done();return}\n    if(inA)buf.push(l)});\n  if(inA)done();return out};\nconst parseLabels=(raw,aliases)=>{const out={};String(raw||'').replace(/\\r\\n?/g,'\\n').split('\\n').forEach(l=>{const m=l.match(/^[\\s>*\\-#]*\\**\\s*([A-Za-z][^:\\n]{1,60}?)\\s*\\**\\s*:\\s*\\**\\s*(.+?)\\s*$/);if(!m)return;const key=m[1].toLowerCase().replace(/\\*+/g,'').replace(/\\s*\\((required|optional)\\)$/,'').trim();const id=aliases[key];const v=m[2].replace(/^\\*+|\\*+$/g,'').trim();if(id&&v&&!/^_?not provided/i.test(v)&&!(id in out))out[id]=v});return out};\nconst TEXT_EXT=/\\.(md|markdown|txt|csv|tsv|json|ya?ml|html?|css|scss|svg|xml|js|jsx|ts|tsx)$/i;\nconst fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';\nconst AS_NAME={summary:'Combined summary',antislop:'Core rules','antislop-ui':'Visual design','antislop-copywriting':'Writing and wording','antislop-human':'Sounding human','antislop-layoutmobile':'Layout and mobile','antislop-code':'Code quality'};\nconst MODE_INFO={summary:['One short page that covers the most important rules from all six rule sets.','A compact file. The AI gets the key do\\'s and don\\'ts without long examples, so it reads your project details sooner.','You want a quick start, use a free or smaller AI plan, or paste into a chat with a size limit.'],paired:['The one-page summary, plus the full rule set for each topic your chosen steps touch. Untick steps and fewer sets are added.','A medium file. Stricter, more detailed guidance exactly where your steps need it, such as writing rules for research steps and code rules for build steps.','You want better results on the parts you\\'re building without the full weight of every rule.'],full:['All six rule sets in full, with every rule and every example: core rules, visual design, writing, sounding human, layout and mobile, and code quality.','The largest file. The most thorough guidance and the fewest generic results, but it takes up more of the AI\\'s memory.','You\\'re handing off a whole project, use a tool with lots of room (like Claude or Cursor), or want the strictest review.']};\nconst FAQ=[[\"start\",\"Getting started\",[[\"What is this site?\",\"A free collection of 25 ready-made instructions (called prompts) for AI tools like Claude, ChatGPT and Cursor. Together they take a website or app from first research to launch. It also includes anti-slop rules that stop the AI from giving you generic, look-alike results.\"],[\"Do I need to know how to code?\",\"No. The questions are in plain language and most steps produce plans, wording and design decisions. A few steps produce code; you can hand those to a developer or ask the AI to explain them.\"],[\"Which AI tools does it work with?\",\"Any AI you chat with: Claude, ChatGPT, Gemini, Cursor, Copilot Chat and others. Everything is plain text, so it pastes anywhere.\"],[\"Is it free? Can I use it for client work?\",\"Yes. Everything is under the MIT licence, so you can use, copy and change it, including for paid and commercial projects.\"],[\"Where should I start?\",\"Building a whole project? Use the Workflow page. Need help with one task, like writing button labels or checking colour contrast? Pick a single prompt from the library.\",\"Open the prompt library\",\"#/prompts\"]]],[\"workflow\",\"Using the workflow\",[[\"What does the Workflow page actually do?\",\"It turns your answers into one file. That file holds all 25 steps in the right order, with your project details already filled in and the anti-slop rules attached. You paste it into an AI once instead of 25 times.\",\"Go to the workflow\",\"#/workflow\"],[\"Which questions do I have to answer?\",\"Only three: the project name, a short description, and what you are building. Everything else is optional. Anything you leave blank, the AI will ask you about when it gets there.\"],[\"What are \\\"shared answers\\\"?\",\"Details that several steps need, like your industry or your audience. You type them once and every step that needs them is filled in automatically.\"],[\"Can I skip steps?\",\"Yes. Untick any step in the list of 25 and it is left out of your file. The file, the progress bar and the checks update straight away.\"],[\"My framework is not in the list. What do I do?\",\"Type its name under \\\"Choose a framework\\\" and press Add framework. It is saved on this device and you can remove it with the × button. If you are unsure, pick \\\"Not sure\\\" and the AI will recommend one.\"],[\"Can I attach files instead of typing?\",\"Yes, in step 06 (real content) and step 07 (design direction). Text files like .md, .txt or .csv go into your file in full. Images and PDFs are listed by name, so attach those in your AI chat when you paste. You can add up to 10 files per step.\"],[\"What do the personality settings mean?\",\"Three dials from 1 (calm) to 3 (bold). Energy is how striking the design feels, Rhythm is how much sections vary from one another, and Motion is how much things move. The middle setting suits most products.\"]]],[\"rules\",\"Anti-slop rules\",[[\"What is \\\"AI slop\\\"?\",\"The tell-tale signs of lazy AI output: buzzwords like \\\"seamless\\\" and \\\"revolutionary\\\", the same purple gradients on every site, vague buttons that say \\\"Learn more\\\", and code that looks fine but breaks. The rules list these patterns so the AI avoids them.\",\"Read the rules\",\"#/antislop\"],[\"Which rules option should I choose?\",\"Combined summary suits most people: one short page with the key rules. Summary plus paired files adds detail where your steps need it. All six files is the strictest and longest. On the Workflow page, the (i) button next to the options compares them side by side.\"],[\"What do the pass and check labels mean?\",\"As you type, your file is checked against the rules. Pass means that rule is met. Check means something needs a look, such as a buzzword in your description. Em dashes are fixed for you; everything else is yours to rewrite.\"]]],[\"file\",\"Your file and the AI\",[[\"How do I use the file once I have it?\",\"Press Copy and paste it into a new AI chat, or Download and attach the .md file. Then type \\\"start\\\". The AI works through one step at a time and asks before moving on.\"],[\"The AI says my file is too long.\",\"Pick Combined summary for the rules, untick steps you do not need, or work one step at a time with the \\\"Copy this step only\\\" button inside each step.\"],[\"What are the words in [BRACKETS] in a prompt?\",\"Spaces for your own details, like [INDUSTRY_TYPE]. On the Workflow page they are filled in from your answers. When you copy a single prompt from the library, replace them yourself or use the fill-in form on that prompt's page.\"]]],[\"site\",\"Privacy and the site\",[[\"Is my information saved or sent anywhere?\",\"It is saved only in this browser, on this device, so you can come back later. Nothing is uploaded to a server. Clearing your browser data, or using a private window, erases it.\"],[\"How do I start over?\",\"On the Workflow page, press \\\"Clear all answers\\\" at the bottom of the \\\"Your workflow file\\\" panel.\"],[\"Can I change the text size or use dark mode?\",\"Yes. Open the Display menu at the top of any page to switch between light and dark, and to make the text larger.\"],[\"Does it work on a phone?\",\"Yes. Every page works on small screens. For long projects a larger screen is more comfortable, and your answers are saved on whichever device you use.\"],[\"What do the Beta and Under revision labels mean?\",\"They mark prompts that are still being improved. They work, but the wording may change. Each prompt page explains its status.\"]]]];\nconst MODES=[['summary','Combined summary','All rules on one page. Fastest to paste.'],['paired','Summary plus paired skill files','Adds the full skill file each included folder needs.'],['full','All six files in full','Every rule and example. Largest file.']];\nconst shiftH=(t,n)=>{let
